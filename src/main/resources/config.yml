# Mutualzz Bridge — default config
# Get your token from Mutualzz → User Settings → Minecraft Bridge.

# Official Mutualzz hub (do not point this at third-party hosts)
hubUrl: wss://bridge.mutualzz.com

# Paste your bridge token from Mutualzz
token: mz_bridge_your_token_here

# Must match the server ID you use when binding Discord / voice in Mutualzz
serverId: survival

# Sync player inventories and ender chests to Mutualzz.
# Space admins can view every player's saved inventory; linked players can view their own.
# Set to false to stop sending inventories (restart the server after changing).
inventorySync: true

# Let space admins kick and ban players from the Mutualzz app.
# Off by default: space admins are not automatically Minecraft operators.
remoteModeration: false

# Commands run as the console. {name} and {reason} are filled in.
# Change these if your ban plugin uses other commands (e.g. "unban {name}").
banCommand: "ban {name} {reason}"
unbanCommand: "pardon {name}"

# Let space admins edit player inventories (give, remove, move, change amount) from the Mutualzz app.
# Off by default. Every edit is checked against the item's exact current state, so stale edits are rejected instead of duplicating items.
remoteInventoryEdit: false
